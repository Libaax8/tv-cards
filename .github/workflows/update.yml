name: Update cards

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    paths: ["make_cards.py", "make_verse.py", "make_days.py", ".github/workflows/update.yml"]

permissions:
  contents: write

concurrency:
  group: update-cards
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet hijridate
      - run: python make_cards.py --print
      - run: python make_verse.py
      - run: python make_days.py
      - name: Commit when something changed
        run: |
          git config user.name "tv-cards"
          git config user.email "tv-cards@users.noreply.github.com"
          git add cards.json timetable.json verse.json days.json
          git diff --cached --quiet || git commit -m "Update cards"
          git push
